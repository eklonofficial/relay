name: Blockhaven

# Pull requests run once (the pull_request event only); pushes to main run too.
on:
  push:
    branches: [main]
    paths:
      - 'docs/games/blockhaven/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/blockhaven.yml'
  pull_request:
    paths:
      - 'docs/games/blockhaven/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/blockhaven.yml'

# A newer push to the same branch cancels the run it supersedes.
concurrency:
  group: blockhaven-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Every relative module import must carry the same ?v= stamp, or a deploy mixes cached and
      # fresh modules. Fix a failure with: node docs/games/blockhaven/tools/stamp.mjs
      - name: Cache-busting stamps
        run: node docs/games/blockhaven/tools/stamp.mjs --check
      - name: Tests
        run: node --test 'docs/games/blockhaven/tests/*.test.mjs'
      - name: Build tooling
        run: npm ci
      - name: Packed build
        run: npm run build
      - name: Browser tooling
        run: npx playwright install --with-deps chromium
      - name: Canvas browser regression checks
        run: npm run test:browser
      - name: Reviewable production files and browser captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-and-checks
          path: build/
