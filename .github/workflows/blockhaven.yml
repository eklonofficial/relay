name: Blockhaven

# Pull requests run once (the pull_request event only); pushes to main run too.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'blockhaven-relay/**'
      - 'render.yaml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/blockhaven.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'blockhaven-relay/**'
      - 'render.yaml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/blockhaven.yml'

# A newer push to the same branch cancels the run it supersedes.
concurrency:
  group: blockhaven-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Every relative module import must carry the same ?v= stamp, or a deploy mixes cached and
      # fresh modules. Fix a failure with: node docs/games/blockhaven/tools/stamp.mjs
      - name: Cache-busting stamps
        run: node docs/games/blockhaven/tools/stamp.mjs --check
      - name: Shock Shellers cache-busting stamps
        run: node docs/games/shockshellers/tools/stamp.mjs --check
      - name: Shared calculator security policy
        run: node docs/games/tools/security.mjs --check
      - name: Tests
        run: node --test 'docs/games/blockhaven/tests/*.test.mjs'
      - name: Shock Shellers tests
        run: node --test 'docs/games/shockshellers/tests/*.test.mjs'
      - name: Shared calculator tests
        run: node --test 'docs/games/tests/*.test.mjs'
      - name: Build tooling
        run: npm ci
      - name: Relay regression checks
        run: npm ci --prefix blockhaven-relay && npm run test:relay
      # Every calculator game plus the shared calculator, into build/games/.
      - name: Packed build
        run: npm run build:site
      - name: Browser tooling
        run: npx playwright install --with-deps chromium
      - name: Canvas browser regression checks
        run: npm run test:browser
      - name: Shock Shellers browser regression checks
        run: npm run test:browser:shockshellers
      # Keep the rest of the site, but never put a calculator game's readable development tree in the
      # Pages artifact. The packed site (shared calculator + every game) replaces those folders at the
      # same paths/origin, which preserves saves.
      - name: Stage website
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p build/pages-input/games
          rsync -a --exclude='games/blockhaven/' --exclude='games/shockshellers/' --exclude='games/calc.html' --exclude='games/vercel.json' --exclude='games/tools/' --exclude='games/tests/' docs/ build/pages-input/
          cp -a build/games/. build/pages-input/games/
      - name: Render documentation
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/jekyll-build-pages@v1
        with:
          source: build/pages-input
          destination: build/pages
      - name: Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages
      - name: Reviewable production files and browser captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-and-checks
          path: build/

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified website
        id: deployment
        uses: actions/deploy-pages@v4
