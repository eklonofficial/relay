# Render Blueprint for the arcade's multiplayer FPS server (fps-server/).
# Render serves it over HTTPS, so the game connects with wss:// on port 443.
services:
  - type: web
    name: arcade-fps-server
    runtime: node
    plan: free
    rootDir: fps-server
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://eklonofficial.github.io
      - key: MAX_PLAYERS
        value: "16"

  # Blockhaven multiplayer relay (blockhaven-relay/): an MQTT-over-WebSocket broker on port 443 that
  # lets friends play together on networks that block direct connections and the public brokers.
  - type: web
    name: blockhaven-relay
    runtime: node
    plan: free
    rootDir: blockhaven-relay
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /health
