# Acoustic echo cancellation for Relay.
#
# This is the trick smart speakers use. The microphone hears everything the
# speakers are playing -- music, a video, Relay's own voice -- and without
# help there is no way to tell that apart from the person talking. So the
# audio being sent to the speakers is used as a *reference*, and an adaptive
# filter subtracts it from what the microphone picks up. What is left is the
# room: you.
#
# `monitor.mode = true` is what makes this transparent. The usual arrangement
# creates a virtual sink that applications must play into for their audio to
# count as the reference, which would mean re-pointing Cider, the browser and
# every game. In monitor mode the module watches the real output instead, so
# everything already playing is the reference and nothing needs re-routing.
#
# It creates one new input device and changes nothing about the existing
# ones. Delete this file and restart PipeWire to undo it completely.
#
# Measured on THECHUNK (fifine USB mic, desk speakers):
#
#   speaker signal removed        -17 dB   (86% of the echo energy gone)
#   room noise, nothing playing   -9.8 dB
#
# That second number looks alarming and is not. Broken down by band it is
# almost entirely the WebRTC high-pass: -16.6 dB below 150 Hz, where desk
# rumble lives. The speech bands are untouched -- -0.6 dB from 300 Hz to
# 1 kHz and -0.1 dB from 1 to 3 kHz -- so the wake word and the transcriber
# see the same signal they always did, minus rumble they never wanted.

context.modules = [
    {   name = libpipewire-module-echo-cancel
        args = {
            library.name  = aec/libspa-aec-webrtc
            monitor.mode  = true

            # 1024/48000 is ~21ms. Shorter starves the filter of the context
            # it needs to converge; longer adds latency before the wake word
            # is even scored.
            node.latency = 1024/48000

            capture.props = {
                target.object = "alsa_input.usb-3142_fifine_Microphone-00.analog-stereo"
                node.passive  = true
            }

            source.props = {
                node.name        = "relay_mic"
                node.description = "Relay microphone (echo cancelled)"
            }

            playback.props = {
                node.passive = true
            }

            aec.args = {
                # Echo cancellation only.
                #
                # Automatic gain control is deliberately off: it rides the
                # level up during quiet passages, which lifts the room noise
                # floor into the range the wake word scores on and causes
                # false triggers. Noise suppression is off for the same
                # reason in reverse -- it is tuned for telephony intelligibility
                # and chews the consonants that a speech model needs.
                webrtc.gain_control      = false
                webrtc.noise_suppression = false
                webrtc.echo_canceller    = true
                # Longer filter tail, for speakers that are across a desk
                # rather than next to the microphone.
                webrtc.extended_filter   = true
            }
        }
    }
]
