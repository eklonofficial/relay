[project]
name = "relay"
version = "0.1.0"
description = "Always-on voice assistant for Hyprland, powered by Claude"
readme = "README.md"
requires-python = "==3.12.*"

# Core = the text path. Deliberately free of torch so `relay ask` works
# without a 3GB install. Audio and model backends live in the extras below.
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "sqlite-vec>=0.1.6",
    "numpy>=1.26",
    "onnxruntime>=1.18",
    # The memory embedder tokenises with these, and onnx-asr uses
    # hf_hub_download to fetch Parakeet. huggingface-hub went 0.x -> 1.x, so
    # ">=0.25" resolves to 0.36 -- which is *older* than 1.3. The floors are
    # what keep the resolver on the 1.x line; tokenizers below 0.22 caps
    # huggingface-hub under 1.0 and drags it back.
    "tokenizers>=0.22",
    "huggingface-hub>=1.3",
    # `relay docs` renders the guide with this. It used to arrive as a
    # transitive dependency of the GPU voice and was never declared, so
    # removing that stack took the styled documentation with it.
    "rich>=13.0",
    "tomli-w>=1.0",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
# Wake word, VAD, capture and playback.
#
# openwakeword is deliberately NOT listed here. It declares tflite-runtime,
# which publishes no cp312 wheels, so naming it makes the whole project
# unresolvable -- `uv run` then fails on every command, not just audio ones.
# Relay loads openWakeWord with inference_framework="onnx" and never imports
# tflite, so the dependency is real only on paper. Install it separately:
#
#     uv pip install --no-deps openwakeword
#
# Its actual runtime needs are onnxruntime, scipy, scikit-learn, tqdm and
# requests, all listed here or in the core dependencies. scikit-learn was
# reaching the venv as a transitive dependency of the GPU voice; with that
# gone, `openwakeword.model` failed to import on `No module named 'sklearn'`
# -- and `import openwakeword` still succeeded, which is exactly how a
# missing wake word hides.
audio = [
    "scikit-learn>=1.0",
    "sounddevice>=0.4.7",
    # No silero-vad. Nothing imports it: the VAD in use is openWakeWord's
    # (`from openwakeword.vad import VAD`), which is ONNX with a bundled
    # silero_vad.onnx. The package declares torch and torchaudio, so leaving
    # it here would have kept four gigabytes installed for an import that
    # never happens.
    "soundfile>=0.12",
    "scipy>=1.13",
    "tqdm>=4.66",
    "requests>=2.31",
]
# Speech models: transcription and the voice.
speech = [
    "onnx-asr>=0.4.0",
    "kokoro-onnx>=0.4.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
relay = "relay.ipc.cli:main"
relayd = "relay.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["relay"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
